name: Docs

on:
  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from git history

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          cache-suffix: docs

      - run: uv run --group docs sphinx-build -W docs docs/_build/html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
