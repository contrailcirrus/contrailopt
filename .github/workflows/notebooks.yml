name: Notebooks

on:
  pull_request:

  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.14'
          cache-suffix: notebooks

      # Restore cached ERA5 and Google Contrail Forecasts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pycontrails
          key: pycontrails-${{ hashFiles('docs/notebooks/*.ipynb') }}
          restore-keys: pycontrails-

      - env:
          CONTRAILS_API_KEY: ${{ secrets.CONTRAILS_API_KEY }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          CDSAPI_URL: 'https://cds.climate.copernicus.eu/api'
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run --group notebooks pytest --nbmake --nbmake-timeout=3000 docs/notebooks
